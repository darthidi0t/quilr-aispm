<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Quilr AISPM Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Schibsted+Grotesk:wght@700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: slim icon rail + work area; KPI strip, then 3/2-column panel grids that stack on narrow screens. Single dark theme matching the Quilr console. */
:root{
  --bg:#0c0d0f; --rail:#0f1013; --panel:#121317; --panel-2:#17191d; --hover:#1d1f24;
  --line:#23252a; --line-2:#30333a;
  --fg:#e7e8eb; --muted:#9a9ea7; --dim:#646871;
  --accent:#3fcf8e; --accent-dim:rgba(63,207,142,.11); --accent-line:rgba(63,207,142,.5);
  --blue:#4d7fe6; --crit:#ff4d4f; --high:#f0565c; --med:#f2b53a; --low:#8aa0c2; --ok:#3fcf8e; --violet:#9b8cf2;
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .dim{color:var(--dim)}

.app{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh;overflow-x:clip}
.app.min{grid-template-columns:60px minmax(0,1fr)}
.rail{position:sticky;top:0;height:100vh;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;padding:12px 10px;gap:2px;overflow-y:auto;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px;flex:none}
.brand b{font-family:'Schibsted Grotesk',var(--sans);font-size:17px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.brand b span{color:var(--accent);font-family:var(--mono);font-size:10px;letter-spacing:.08em;margin-left:6px}
.logo{width:28px;height:28px;flex:none;display:block}
.rgrp{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:12px 10px 4px;white-space:nowrap}
.nav{width:100%;height:34px;flex:none;border-radius:6px;border:1px solid transparent;background:none;display:flex;align-items:center;gap:10px;padding:0 10px;color:var(--muted);position:relative;text-align:left;font-size:13px}
.nav svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav:hover{background:var(--hover);color:var(--fg)}
.nav.on{background:var(--accent-dim);border-color:var(--accent-line);color:var(--accent)}
.nav .tip{position:absolute;left:52px;top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--panel-2);border:1px solid var(--line-2);padding:4px 8px;border-radius:4px;font-size:12px;color:var(--fg);pointer-events:none;opacity:0;transition:opacity .12s;z-index:50;display:none}
.app.min .nav{justify-content:center;padding:0}
.app.min .nav .lab,.app.min .brand b,.app.min .rgrp,.app.min .who{display:none}
.app.min .nav .tip{display:block}
.app.min .nav:hover .tip{opacity:1}
.app.min .brand{justify-content:center;padding-inline:0}
.rail .sp{flex:1;min-height:12px}
.who{display:flex;flex-direction:column;min-width:0;font-size:12px;line-height:1.3}
.who small{color:var(--dim);font-family:var(--mono);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urow{display:flex;align-items:center;gap:10px;padding:8px 6px 0;border-top:1px solid var(--line);margin-top:6px}
.app.min .urow{justify-content:center;padding-inline:0}
.avatar{width:30px;height:30px;border-radius:50%;background:#2f4fd1;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}

main{min-width:0}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 24px 14px;flex-wrap:wrap}
.top h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.top p{margin:4px 0 0;color:var(--muted);font-size:12px;max-width:70ch}
.top-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sel{background:var(--panel);border:1px solid var(--line-2);border-radius:4px;padding:6px 10px;font-size:12px;font-family:var(--mono)}
.iconbtn{width:34px;height:34px;border-radius:6px;background:var(--panel);border:1px solid var(--line-2);display:grid;place-items:center;position:relative}
.iconbtn svg{width:16px;height:16px;fill:none;stroke:var(--fg);stroke-width:1.6}
.iconbtn .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--high);border:2px solid var(--panel)}

.tabs{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;padding:10px 12px;color:var(--muted);font-size:13.5px;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}

.content{padding:18px 24px 48px;display:flex;flex-direction:column;gap:16px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sec-h h2{margin:0;font-size:14px;font-weight:600}
.sec-h p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:var(--mono);font-size:12px;padding:6px 12px;border-radius:4px;border:1px solid var(--line-2);background:var(--panel)}
.btn:hover{background:var(--hover)}
.btn.pri{color:var(--accent);border-color:var(--accent-line);background:var(--accent-dim)}

.meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.meta .lbl{color:var(--dim);letter-spacing:.06em;text-transform:uppercase;font-size:10.5px}
.srcchip{display:inline-flex;gap:6px;align-items:center}
.srcchip b{color:var(--fg);font-weight:600;font-family:var(--sans)}
.srcdot{width:14px;height:14px;border-radius:3px;display:inline-grid;place-items:center;font-size:8px;font-weight:700;color:#fff;font-family:var(--sans)}
.tchip{border:1px solid var(--line-2);border-radius:3px;padding:2px 6px;color:var(--fg);letter-spacing:.06em;font-size:10.5px;text-transform:uppercase}
.tchip.on{border-color:var(--blue);color:#9db8ff}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.kpi{background:var(--panel);padding:14px 14px 12px;min-width:0}
.kpi .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:2px}
.c-crit{color:var(--crit)} .c-high{color:var(--high)} .c-med{color:var(--med)} .c-low{color:var(--low)} .c-ok{color:var(--ok)} .c-blue{color:#86a8ff}

.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
@media (max-width:1180px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){.g3,.g2{grid-template-columns:minmax(0,1fr)}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:12px}
.ph{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ph h3{margin:0;font-size:13px;font-weight:600}
.ph p{margin:2px 0 0;font-size:11.5px;color:var(--muted);max-width:68ch}
.ph .r{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;text-align:right}
.ph .big{font-size:22px;font-weight:600;color:var(--fg);font-family:var(--sans)}

.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:5px;background:var(--panel);flex-wrap:wrap}
.seg button{background:none;border:1px solid transparent;border-radius:4px;padding:5px 11px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--accent-dim);border-color:var(--accent-line);color:var(--accent)}

/* bars */
.bars{display:flex;flex-direction:column;gap:11px}
.bar .t{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-bottom:5px}
.bar .t span:last-child{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.track{height:5px;background:var(--line-2);border-radius:3px;overflow:hidden;display:flex}
.fill{height:100%;border-radius:3px;background:var(--blue)}
.track.stack .fill{border-radius:0}
.hrow{display:grid;grid-template-columns:minmax(80px,170px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:12px}
.hrow .n{text-align:right;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .v{font-family:var(--mono);font-size:11px;color:var(--muted)}
.hrow .track{height:10px;border-radius:2px}

.sevgrid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:4px}
.sevgrid div{text-align:center;padding:10px 4px;border-left:1px solid var(--line)}
.sevgrid div:first-child{border-left:0}
.sevgrid b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.sevgrid span{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}

.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:0}
.li .a{min-width:0}
.li .a div:first-child{font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.li .sub{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.score{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.score small{font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.06em;margin-left:4px}
.clickable{cursor:pointer}
.clickable:hover{background:var(--hover)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;background:var(--panel-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.clickable:hover td{background:var(--hover)}
td.r,th.r{text-align:right}
td .s2{display:block;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.nowrap{white-space:nowrap}

.sev{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border-radius:3px;border:1px solid;white-space:nowrap}
.sev-critical{color:var(--crit);border-color:rgba(255,77,79,.45);background:rgba(255,77,79,.08)}
.sev-high{color:var(--high);border-color:rgba(240,86,92,.35)}
.sev-medium{color:var(--med);border-color:rgba(242,181,58,.35)}
.sev-low{color:var(--low);border-color:rgba(138,160,194,.3)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-ok{color:var(--ok)} .st-warn{color:var(--med)} .st-bad{color:var(--high)} .st-off{color:var(--dim)} .st-info{color:#86a8ff}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:3px;background:var(--panel-2);border:1px solid var(--line-2);color:var(--muted);margin:1px 3px 1px 0;white-space:nowrap}

.search{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search input,.search select{background:var(--panel);border:1px solid var(--line-2);border-radius:4px;padding:7px 10px;font-size:12.5px;min-width:0}
.search input{flex:1 1 220px}

/* feeds */
.feed{display:flex;flex-direction:column;gap:0}
.ev{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.ev:first-child{border-top:0;padding-top:0}
.ev time{font-family:var(--mono);font-size:10.5px;color:var(--dim);padding-top:2px}
.ev .d{font-size:12.5px}
.ev .d .s2{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.act{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:3px;white-space:nowrap}
.act-block{color:var(--high);background:rgba(240,86,92,.1)}
.act-redact{color:var(--med);background:rgba(242,181,58,.1)}
.act-alert{color:#86a8ff;background:rgba(77,127,230,.12)}
.act-allow{color:var(--ok);background:var(--accent-dim)}

/* svg charts */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--muted);font-family:var(--mono);font-size:10px}
svg.chart .grid line{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* graph */
.gwrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--bg);padding:6px}
svg.flow{display:block;min-width:640px;width:100%;height:auto}
svg.flow text{font-family:var(--sans);font-size:11px;fill:var(--fg)}
svg.flow text.k{font-family:var(--mono);font-size:8.5px;fill:var(--dim);letter-spacing:.06em;text-transform:uppercase}
svg.flow text.h{font-family:var(--mono);font-size:9px;fill:var(--muted);letter-spacing:.08em}
svg.flow rect.node{fill:var(--panel-2);stroke:var(--line-2)}
svg.flow rect.node.bad{stroke:var(--high)}
svg.flow rect.node.warn{stroke:var(--med)}
svg.flow rect.node.jewel{stroke:var(--violet)}
svg.flow path.e{fill:none;stroke:var(--line-2);stroke-width:1.4}
svg.flow path.e.hot{stroke:var(--high);stroke-dasharray:5 4;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-18}}
@media (prefers-reduced-motion:reduce){svg.flow path.e.hot{animation:none}}

/* heatmap */
.atlas{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:6px;min-width:860px}
.atlas .col h4{margin:0 0 6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;min-height:26px}
.atlas .cell{border:1px solid var(--line);border-radius:3px;padding:6px 7px;margin-bottom:6px;font-size:11px;line-height:1.3}
.atlas .cell b{display:block;font-family:var(--mono);font-size:9.5px;font-weight:500;color:var(--muted);margin-bottom:2px}
.atlas .cell span{font-family:var(--mono);font-size:10px;float:right;color:var(--fg)}
.matrix{display:grid;grid-template-columns:28px repeat(5,1fr);gap:3px;font-family:var(--mono);font-size:10px}
.matrix div{aspect-ratio:1.6;display:grid;place-items:center;border-radius:2px;max-width:100%}
.matrix .ax{color:var(--dim)}

/* gauge */
.gauge{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.gauge svg{width:150px;height:auto;flex:none}

/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:820px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stage{border:1px solid var(--line);border-radius:4px;padding:10px;background:var(--panel-2);display:flex;flex-direction:column;gap:6px;min-width:0}
.stage h4{margin:0;font-size:12px;font-weight:600}
.stage .ck{font-size:11px;display:flex;gap:6px;align-items:baseline;color:var(--muted)}
.stage .ck i{font-style:normal;font-family:var(--mono);font-size:10px}

/* framework cards */
.fw{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.fwc{border:1px solid var(--line);border-radius:4px;padding:12px;background:var(--panel-2);display:flex;flex-direction:column;gap:8px}
.fwc h4{margin:0;font-size:12.5px;font-weight:600}
.fwc .pct{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.fwc .s2{font-family:var(--mono);font-size:10.5px;color:var(--dim)}

/* trace */
.wf{display:flex;flex-direction:column;gap:6px}
.wf .row{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:12px}
.wf .row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wf .lane{position:relative;height:14px;background:var(--panel-2);border-radius:2px}
.wf .lane i{position:absolute;top:2px;bottom:2px;border-radius:2px}
.wf .row .ms{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:right}
.code{font-family:var(--mono);font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;color:#c9cdd4;line-height:1.55}
.code .kw{color:#86a8ff} .code .st{color:var(--accent)} .code .cm{color:var(--dim)}
textarea.code{width:100%;min-height:210px;resize:vertical}

/* toggle */
.tg{width:32px;height:18px;border-radius:9px;background:var(--line-2);border:0;position:relative;flex:none;padding:0}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:left .15s}
.tg.on{background:var(--accent-line)} .tg.on::after{left:16px;background:var(--accent)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);border-left:1px solid var(--line-2);z-index:90;overflow-y:auto;padding:18px 18px 40px;display:flex;flex-direction:column;gap:14px}
.drawer h2{margin:0;font-size:17px;font-weight:600}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:7px 12px;font-size:12.5px}
.kv dt{font-family:var(--mono);font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tree{font-family:var(--mono);font-size:12px;line-height:1.9}
.tree .br{color:var(--dim)}
.tree .ty{font-size:9.5px;letter-spacing:.06em;color:var(--dim);text-transform:uppercase;margin-left:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--accent-line);color:var(--fg);padding:8px 14px;border-radius:4px;font-size:12.5px;z-index:100}

/* v2: clickable records, drawers, logs */
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
.panel .li,.ev{cursor:pointer}
.panel .li:hover,.ev:hover{background:linear-gradient(90deg,var(--hover),transparent)}
.kpi[data-nav]{cursor:pointer}
.kpi[data-nav]:hover{background:var(--panel-2)}
.fwc[data-fw],[data-fw]{cursor:pointer}
.fwc[data-fw]:hover{border-color:var(--line-2);background:var(--hover)}
.lnk{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--accent-line)}
.drawer.wide{width:min(1000px,100%)}

function niceMax(v){const m=Math.pow(10,Math.floor(Math.log10(v)));const f=v/m;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*m}

function lineChart(series,labels,o={}){
 const W=600,H=o.h||190,L=38,R=12,T=10,B=24,n=labels.length;
 const all=series.flatMap(s=>s.v).concat(o.th?[o.th]:[]);
 const max=o.max||niceMax(Math.max(...all)*1.08);
 const x=i=>L+i*(W-L-R)/(n-1), y=v=>T+(H-T-B)*(1-v/max);
 let g='<g class="grid">';
 for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text x="${L-6}" y="${yy+3}" text-anchor="end">${o.fmt?o.fmt(v):+v.toFixed(2)}</text>`}
 g+='</g>';
 const step=Math.ceil(n/7);
 labels.forEach((l,i)=>{if(i%step===0||i===n-1)g+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${l}</text>`});
 if(o.th!=null){const yy=y(o.th);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--high)" stroke-dasharray="4 4"/><text x="${W-R}" y="${yy-5}" text-anchor="end" style="fill:var(--high)">${o.thLabel||'threshold'}</text>`}
 series.forEach((s,si)=>{
  const pts=s.v.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  if(si===0&&o.area!==false)g+=`<polygon points="${x(0)},${y(0)} ${pts} ${x(n-1)},${y(0)}" fill="${s.c}" opacity=".1"/>`;
  g+=`<polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="1.8" stroke-linejoin="round"/>`;
  const lv=s.v[n-1];g+=`<circle cx="${x(n-1)}" cy="${y(lv)}" r="3.5" fill="${s.c}" stroke="var(--panel)" stroke-width="2"/>`;
 });
 const leg=series.length>1||o.legend?`<div class="legend">${series.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join('')}</div>`:'';
 return `${leg}<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.label||'trend chart'}">${g}</svg>`;
}
function vbars(data,o={}){
 const W=600,H=o.h||200,L=34,R=10,T=10,B=26,n=data.length;
 const max=niceMax(Math.max(...data.map(d=>d.v))*1.05);
 const bw=Math.min(36,(W-L-R)/n*.5),y=v=>T+(H-T-B)*(1-v/max);
 let g='<g class="grid">';
 for(let k=0;k<=4;k++){const v=max*k/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${Math.round(v)}</text>`}
 g+='</g>';
 data.forEach((d,i)=>{const cx=L+(i+.5)*(W-L-R)/n;const yy=y(d.v),yi=y(d.inv||0);
  g+=`<rect x="${cx-bw/2}" y="${yy}" width="${bw}" height="${y(0)-yy}" fill="${o.c||'#a8772a'}" rx="1"/>`;

function hsh(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16).padStart(8,'0')}
const hx=(s,n=32)=>{let o='',i=0;while(o.length<n)o+=hsh(s+'#'+(i++));return o.slice(0,n)};
const uuid=s=>{const h=hx(s);return `${h.slice(0,8)}-${h.slice(8,12)}-4${h.slice(13,16)}-a${h.slice(17,20)}-${h.slice(20,32)}`};
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');

function mkTs(t,seed,add=0){
 const hm=t||('11:0'+(num(seed)%10));const p=hm.split(':');const ss=p[2]!=null?+p[2]:num(seed+'s')%60;
 const tot=((+p[0])*3600+(+p[1])*60+ss)*1000+num(seed+'m')%900+add;
 const f=x=>[Math.floor(x/3600000)%24,Math.floor(x/60000)%60,Math.floor(x/1000)%60,x%1000],z=n=>String(n).padStart(2,'0'),z3=n=>String(n).padStart(3,'0');
 const [h,m,s,ms]=f(tot),u=tot-19800000,[uh,um,us,ums]=f((u+86400000)%86400000);
 return {local:`2026-10-05T${z(h)}:${z(m)}:${z(s)}.${z3(ms)}+05:30`,utc:`2026-10-0${u<0?4:5}T${z(uh)}:${z(um)}:${z(us)}.${z3(ums)}Z`,epoch:Math.floor((Date.UTC(2026,9,5)+u)/1000),ms:Date.UTC(2026,9,5)+u};
}
